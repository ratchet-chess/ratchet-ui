<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ratchet Chess</title>
    <meta
      name="description"
      content="Play RatchetHCE and UCI over WASI chess engines locally in your browser, run SPRT matches and tournaments, and inspect WASI builds."
    />
    <meta property="og:title" content="Ratchet Chess" />
    <meta
      property="og:description"
      content="Play RatchetHCE and UCI over WASI chess engines locally in your browser, run SPRT matches and tournaments, and inspect WASI builds."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ratchetchess.com/" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // the theme before the first paint, as src/ui/theme.ts sets it later
      try {
        const t = localStorage.getItem('ratchet-ui.theme');
        const light =
          t === 'light' || (t !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
